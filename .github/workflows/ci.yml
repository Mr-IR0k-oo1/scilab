name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
        working-directory: apps/desktop
      - run: npx vite build
        working-directory: apps/desktop

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo build
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy -- -D warnings
        working-directory: apps/desktop/src-tauri

  release:
    name: Build & Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node Modules
        run: npm ci
      - name: Build Python Sidecar
        shell: bash
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pyinstaller
          
          if [ "${{ matrix.platform }}" = "ubuntu-latest" ]; then TARGET="x86_64-unknown-linux-gnu"; fi
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then TARGET="x86_64-apple-darwin"; fi
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then TARGET="x86_64-pc-windows-msvc.exe"; fi
          
          pyinstaller --onefile --name fossee-backend-$TARGET run.py
          mkdir -p ../apps/desktop/src-tauri/binaries
          cp dist/fossee-backend-$TARGET ../apps/desktop/src-tauri/binaries/
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Scilab Studio v__VERSION__'
          releaseDraft: true
