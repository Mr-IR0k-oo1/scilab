services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8747:8747"
    environment:
      - FOSSEE_BACKEND_PORT=8747
      - HOST=0.0.0.0
    restart: unless-stopped

  desktop-web:
    build:
      context: .
      dockerfile: apps/desktop/Dockerfile
    ports:
      - "1420:1420"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8747
    depends_on:
      - backend
    restart: unless-stopped
